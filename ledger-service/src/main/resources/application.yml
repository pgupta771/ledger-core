server:
  port: 8080

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${POSTGRES_USER:ledger}
    password: ${POSTGRES_PASSWORD:ledger}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

ledger:
  concurrency: ${LEDGER_CONCURRENCY:pessimistic}
  outbox:
    poll-interval-ms: ${LEDGER_OUTBOX_POLL_MS:200}
    batch-size: 100
    topic: ledger.transfers.v1
  security:
    jwt-secret: ${LEDGER_JWT_SECRET:dev-only-hs256-signing-key-must-be-at-least-32-bytes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
